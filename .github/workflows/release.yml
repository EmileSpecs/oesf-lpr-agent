name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify tag matches package.json
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(node -p "require('./package.json').version")
          echo "tag=$TAG package=$VER"
          test "$TAG" = "$VER"

      - name: Build binaries
        run: npm run build

      - name: SHA256SUMS
        shell: bash
        run: |
          cd dist/bin
          sha256sum oesf-lpr-agent-win-x64.exe oesf-lpr-agent-linux-x64 > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Stage release files
        shell: bash
        run: |
          VER=$(node -p "require('./package.json').version")
          mkdir -p dist/release
          cp dist/bin/oesf-lpr-agent-win-x64.exe dist/release/
          cp dist/bin/oesf-lpr-agent-linux-x64 dist/release/
          cp dist/SHA256SUMS.txt dist/release/
          cp "dist/oesf-lpr-agent-${VER}-win-x64.zip" dist/release/ || true
          cp "dist/oesf-lpr-agent-${VER}-linux-x64.tar.gz" dist/release/ || true
          ls -la dist/release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/release/*
